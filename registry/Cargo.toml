[package]
name = "registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Cole Williams"]
publish = false
description = "NEAR contract storing signed-off audit verdicts keyed by contract code hash"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
# Sandbox tests (tests/sandbox.rs): run the real wasm in a local NEAR node.
anyhow = "1"
near-workspaces = "0.24.0"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wasmparser = "0.243"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
