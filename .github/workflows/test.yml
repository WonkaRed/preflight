# Runs `make test` on every push and pull request: builds the scanner, the fixture contracts and the registry, runs every
# sandbox exploit test, then typechecks and tests the guard and tests the web page. The README badge shows this run.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Ubuntu 24.04 has glibc 2.39, which the NEAR sandbox binary needs (see "Requirements" in the README).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # With no argument rustup installs what rust-toolchain.toml pins: the channel, and the wasm32 target.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          rustup target list --installed | grep -x wasm32-unknown-unknown
      # The repository holds three cargo workspaces (the contract crates cannot build natively, see Cargo.toml).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            registry
            fixtures
      # guard/package.json "engines" and guard/.npmrc (engine-strict) require this version or newer.
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
      - run: make test
