[package]
name = "swap-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Sandbox tests of The Swap: the real chameleon and switch wasm running in a local NEAR node"

[dev-dependencies]
anyhow = "1"
borsh = "1"
near-workspaces = "0.24.0"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
