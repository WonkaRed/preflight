[package]
name = "preflight-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Preflight compiled to WebAssembly for the static demo page in web/"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
preflight = { path = "../scanner", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
